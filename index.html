<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Display</title>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<header>
  <h1>Chord Display</h1>
  <div id="status"><span class="dot" id="statusDot"></span><span id="statusText">Starting…</span></div>
  <div id="inputs"></div>
  <label class="pick">Mode
    <select id="modeSel">
      <option value="free">Free play</option>
      <option value="notes">Note practice</option>
      <option value="chords">Chord practice</option>
      <option value="progressions">Progression practice</option>
      <option value="scales">Scale practice</option>
      <option value="diatonic">Diatonic chords</option>
      <option value="routines">Routines</option>
    </select>
  </label>
  <label class="pick" id="keyPick" title="Key for free play">Key
    <select id="keySel"></select>
  </label>
  <div class="spacer"></div>
  <span id="pedal" title="Sustain pedal (CC64)">Ped.</span>
  <button id="retry" hidden title="Ask for MIDI access again">Retry MIDI</button>
  <button id="panic" title="Clear all notes (Esc)">Clear</button>
</header>

<main>
  <section class="card" id="staffCard"><div id="staff"></div><div id="circle" hidden></div></section>
  <section class="card" id="chordCard">
    <div id="freeView">
      <div id="chordName"></div>
      <div id="chordSub">Play something</div>
      <div id="roman"></div>
      <div id="alts"></div>
    </div>
    <div id="practice" hidden>
      <div id="beat" hidden title="Metronome"></div>
      <div id="practiceLabel"></div>
      <div id="practicePrompt"></div>
      <div id="practiceSub"></div>
      <div id="practiceFeedback"></div>
      <div id="practiceFooter"><span id="practiceScore"></span><button id="practiceSkip" title="Skip this one">Skip</button></div>
      <div id="chordOptions" hidden>
        <label class="pick">Prompts
          <select id="promptStyle">
            <option value="names">Chord names</option>
            <option value="roman">Roman numerals</option>
          </select>
        </label>
        <label class="opt" id="inversionsOpt"><input type="checkbox" id="optInversions"> Specific inversions</label>
        <details id="chordFilters">
          <summary id="chordFilterSummary"></summary>
          <div id="chordFilterBody"></div>
        </details>
      </div>
      <div id="routineOptions" hidden>
        <label class="pick">Routine
          <select id="routineSel"></select>
        </label>
        <label class="pick">Circle of fifths
          <select id="routineDir">
            <option value="sharps">Sharps first (C G D …)</option>
            <option value="flats">Flats first (C F B♭ …)</option>
          </select>
        </label>
        <button id="routineRestart" title="Start the routine over">Restart routine</button>
      </div>
      <div id="exerciseOptions" hidden>
        <label class="pick" data-option="key">Key
          <select id="exKey"></select>
        </label>
        <label class="pick" data-option="octaves">Octaves
          <select id="exOctaves"><option value="1">1</option><option value="2">2</option></select>
        </label>
        <label class="pick" data-option="minorForm">Minor scale
          <select id="exMinorForm">
            <option value="natural">Natural</option>
            <option value="harmonic">Harmonic</option>
            <option value="melodic">Melodic</option>
          </select>
        </label>
        <label class="pick" data-option="sevenths">Chords
          <select id="exChords"><option value="triads">Triads</option><option value="sevenths">Seventh chords</option></select>
        </label>
        <label class="opt" data-option="rootPosition"><input type="checkbox" id="exRootPosition"> Root position only</label>
        <div class="metronomeOptions" data-option="metronome">
          <label class="opt"><input type="checkbox" id="exMetronome"> Metronome</label>
          <span id="metronomeDetails">
            <label class="pick">BPM <input type="number" id="exBpm" min="30" max="240" step="1"></label>
            <label class="pick">Notes per beat
              <select id="exSubdivision">
                <option value="1">1 (quarters)</option>
                <option value="2">2 (eighths)</option>
                <option value="4">4 (sixteenths)</option>
              </select>
            </label>
            <label class="pick" title="How close to the beat counts as on time">Timing
              <select id="exStrictness"><option value="strict">Strict (±50 ms)</option><option value="loose">Loose (±80 ms)</option></select>
            </label>
            <label class="pick" title="Taken off your note times. Positive if you're judged consistently late, negative if early (rushing). Calibrate measures it.">Latency (ms)
              <input type="number" id="latency" min="-200" max="300" step="5">
            </label>
            <button id="calibrate" title="Play a note on each click to measure your latency">Calibrate</button>
            <span id="outputLatencyNote" hidden></span>
          </span>
        </div>
      </div>
    </div>
  </section>
</main>

<dialog id="calibration"></dialog>
<footer>
  <label class="opt"><input type="checkbox" id="optPedal" checked> Pedal-held notes count toward chord</label>
  <span>Computer keys: <kbd>A</kbd>–<kbd>K</kbd> white, <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> black, <kbd>Z</kbd>/<kbd>X</kbd> octave, <kbd>Space</kbd> pedal, <kbd>Esc</kbd> clear</span>
  <span id="kbdOct"></span>
</footer>
</body>
</html>
