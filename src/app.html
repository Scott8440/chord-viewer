<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Display</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --line: #2c3038;
    --text: #e9e6df;
    --muted: #8d919b;
    --accent: #e8b44c;
    --paper: #f7f4ec;
    --ink: #1a1a1a;
    --sustain-ink: #9a968c;
    --ok: #6cc28a;
    --warn: #e07a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--warn); }
  #inputs { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px;
    font-size: 12px; color: var(--text); cursor: pointer; user-select: none;
  }
  .chip input { margin: 0; accent-color: var(--accent); }
  .chip.off { color: var(--muted); }
  .spacer { flex: 1; }
  #keyPick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  #keySel {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 13px;
  }
  #roman {
    margin-top: 10px; font-family: Georgia, "Times New Roman", serif; font-size: 30px;
    color: var(--accent); min-height: 1.2em;
  }
  #pedal {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 8px;
  }
  #pedal.down { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  button {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }

  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 20px; padding: 20px; align-items: stretch; min-height: 0;
  }
  .card { border-radius: 10px; min-height: 0; }
  #staffCard {
    background: var(--paper); display: flex; align-items: center; justify-content: center;
    padding: 12px; min-height: 340px;
  }
  #staff { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #staff svg { max-width: 100%; max-height: 72vh; height: auto; }
  #chordCard {
    background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: center; padding: 28px 32px;
  }
  #chordName {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(56px, 9vw, 128px); line-height: 1; font-weight: 400;
    color: var(--text); word-break: break-word; min-height: 1em;
    transition: opacity .25s;
  }
  #chordName.stale { opacity: .3; }
  #chordName .acc { font-size: .8em; }
  #chordName .ext { font-size: .55em; vertical-align: .55em; }
  #chordName .bass { color: var(--muted); }
  #chordSub { margin-top: 14px; color: var(--muted); font-size: 16px; min-height: 1.4em; }
  #alts { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; min-height: 30px; }
  #alts span {
    font-family: Georgia, serif; font-size: 17px; padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
  }
  #notes { margin-top: 22px; font-size: 13px; color: var(--muted); letter-spacing: .04em; min-height: 1.4em; }
  #notes b { color: var(--text); font-weight: 500; }
  #notes .sus { color: var(--muted); }

  footer {
    padding: 10px 20px 14px; color: var(--muted); font-size: 12px;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
  }
  kbd {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
    color: var(--text);
  }
  label.opt { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  label.opt input { accent-color: var(--accent); }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    header, footer { padding-left: 16px; padding-right: 16px; }
    #staffCard { min-height: 260px; }
  }
</style>
</head>
<body>
<header>
  <h1>Chord Display</h1>
  <div id="status"><span class="dot" id="statusDot"></span><span id="statusText">Starting…</span></div>
  <div id="inputs"></div>
  <label id="keyPick">Key
    <select id="keySel"></select>
  </label>
  <div class="spacer"></div>
  <span id="pedal" title="Sustain pedal (CC64)">Ped.</span>
  <button id="retry" hidden title="Ask for MIDI access again">Retry MIDI</button>
  <button id="panic" title="Clear all notes (Esc)">Clear</button>
</header>

<main>
  <section class="card" id="staffCard"><div id="staff"></div></section>
  <section class="card" id="chordCard">
    <div id="chordName"></div>
    <div id="chordSub">Play something</div>
    <div id="roman"></div>
    <div id="alts"></div>
    <div id="notes"></div>
  </section>
</main>

<footer>
  <label class="opt"><input type="checkbox" id="optPedal" checked> Pedal-held notes count toward chord</label>
  <span>Computer keys: <kbd>A</kbd>–<kbd>K</kbd> white, <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> black, <kbd>Z</kbd>/<kbd>X</kbd> octave, <kbd>Space</kbd> pedal, <kbd>Esc</kbd> clear</span>
  <span id="kbdOct"></span>
</footer>

<script>/*__TONAL__*/</script>
<script>/*__VEXFLOW__*/</script>
<script>
"use strict";
const { Chord, ChordType } = Tonal;
const VF = Vex.Flow;

/* ---------------------------------------------------------------
   Note state
   held:      note -> Set of "source:channel" keys holding it down
   sustained: notes released while the pedal was down
   --------------------------------------------------------------- */
const held = new Map();
const sustained = new Set();
const pedalBySource = new Map();   // "source:channel" -> bool
let lastResult = null;

function pedalDown() {
  for (const v of pedalBySource.values()) if (v) return true;
  return false;
}

function noteOn(note, src) {
  if (!held.has(note)) held.set(note, new Set());
  held.get(note).add(src);
  sustained.delete(note);
  changed();
}

function noteOff(note, src) {
  const s = held.get(note);
  if (!s) return;
  s.delete(src);
  if (s.size === 0) {
    held.delete(note);
    if (pedalDown()) sustained.add(note);
  }
  changed();
}

function setPedal(src, down) {
  pedalBySource.set(src, down);
  if (!pedalDown()) sustained.clear();
  document.getElementById("pedal").classList.toggle("down", pedalDown());
  changed();
}

function allOff(srcPrefix) {
  for (const [note, s] of held) {
    for (const k of [...s]) if (!srcPrefix || k.startsWith(srcPrefix)) s.delete(k);
    if (s.size === 0) held.delete(note);
  }
  if (!srcPrefix) { sustained.clear(); pedalBySource.clear(); }
  document.getElementById("pedal").classList.toggle("down", pedalDown());
  changed();
}

function soundingNotes() {
  const set = new Set(held.keys());
  if (document.getElementById("optPedal").checked) for (const n of sustained) set.add(n);
  return [...set].sort((a, b) => a - b);
}

/* ---------------------------------------------------------------
   MIDI input
   --------------------------------------------------------------- */
const enabledInputs = new Map();  // input.id -> bool

function handleMidi(input, e) {
  if (enabledInputs.get(input.id) === false) return;
  const [status, d1, d2] = e.data;
  const type = status & 0xf0, ch = status & 0x0f;
  const src = input.id + ":" + ch;
  if (type === 0x90 && d2 > 0) noteOn(d1, src);
  else if (type === 0x80 || (type === 0x90 && d2 === 0)) noteOff(d1, src);
  else if (type === 0xb0) {
    if (d1 === 64) setPedal(src, d2 >= 64);
    else if (d1 === 120 || d1 === 123) allOff(input.id + ":");
  }
}

function renderInputs(access) {
  const box = document.getElementById("inputs");
  box.innerHTML = "";
  let count = 0;
  for (const input of access.inputs.values()) {
    if (input.state !== "connected") continue;
    count++;
    if (!enabledInputs.has(input.id)) enabledInputs.set(input.id, true);
    input.onmidimessage = (e) => handleMidi(input, e);
    const label = document.createElement("label");
    label.className = "chip" + (enabledInputs.get(input.id) ? "" : " off");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = enabledInputs.get(input.id);
    cb.onchange = () => {
      enabledInputs.set(input.id, cb.checked);
      label.classList.toggle("off", !cb.checked);
      if (!cb.checked) allOff(input.id + ":");
    };
    label.append(cb, document.createTextNode(input.name || "MIDI input"));
    box.append(label);
  }
  setStatus(count ? "ok" : "", count ? `${count} input${count > 1 ? "s" : ""}` : "No MIDI inputs found — plug one in");
}

function setStatus(kind, text) {
  document.getElementById("statusDot").className = "dot " + kind;
  document.getElementById("statusText").textContent = text;
}

async function initMidi() {
  if (!navigator.requestMIDIAccess) {
    setStatus("err", "This browser has no Web MIDI — use Chrome or Edge");
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    renderInputs(access);
    access.onstatechange = () => renderInputs(access);
  } catch (err) {
    const framed = window.top !== window;
    setStatus("err", framed
      ? "MIDI blocked: this page is inside a preview. Open the file directly in Chrome or Edge."
      : "MIDI access denied. Allow MIDI in the address bar's site settings, then click Retry.");
    document.getElementById("retry").hidden = false;
  }
}

/* ---------------------------------------------------------------
   Chord detection
   tonal's Chord.detect finds every chord whose pitch-class set
   matches exactly; we re-rank so common chords beat exotic ones
   (e.g. E-G-C -> "C/E", not "Em#5").
   --------------------------------------------------------------- */
const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const LETTERS = "CDEFGAB";
const SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
// Conventional root spellings, by chord quality
const ROOT_MAJOR = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const ROOT_MINOR = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
const FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

/* ---------------------------------------------------------------
   Key
   --------------------------------------------------------------- */
const KEY_MAJORS = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const KEY_MINORS = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
let currentKey = null;

function buildKey(value) {
  if (!value) return null;
  const [tonic, mode] = value.split(":");
  const k = mode === "major" ? Tonal.Key.majorKey(tonic) : Tonal.Key.minorKey(tonic);
  const scale = mode === "major" ? k.scale : k.natural.scale;
  const spell = new Array(12).fill(null);
  scale.forEach(n => (spell[chromaOf(n)] = n));
  const inKey = new Set(scale.map(chromaOf));
  let leadingTone = null;
  if (mode === "minor") {            // harmonic minor's raised 7th counts as in-key
    leadingTone = k.harmonic.scale[6];
    spell[chromaOf(leadingTone)] = leadingTone;
    inKey.add(chromaOf(leadingTone));
  }
  const sig = k.keySignature;
  const chromatic = sig.includes("b") ? FLAT : sig.includes("#") ? SHARP : ROOT_MAJOR;
  for (let pc = 0; pc < 12; pc++) if (!spell[pc]) spell[pc] = chromatic[pc];
  // Alteration the key signature applies to each letter
  const sigAlter = {};
  scale.forEach(n => (sigAlter[n[0]] = alterOf(n.slice(1))));
  return {
    tonic, mode, tonicPc: chromaOf(tonic), scale, spell, inKey, leadingTone, sigAlter,
    vfKey: mode === "major" ? tonic : tonic + "m",
    label: tonic + (mode === "major" ? " major" : " minor"),
  };
}

function alterOf(accStr) {
  return [...accStr].reduce((a, ch) => a + (ch === "#" ? 1 : ch === "b" ? -1 : 0), 0);
}

// Roman numeral for a chord relative to the current key, e.g. V7, ii7, viiø7, ♭VII
function romanFor(r, key) {
  const NUM = ["I", "II", "III", "IV", "V", "VI", "VII"];
  const deg = (LETTERS.indexOf(r.root[0]) - LETTERS.indexOf(key.tonic[0]) + 7) % 7;
  const expected = key.scale[deg];
  let acc = "";
  if (r.root !== expected && r.root !== key.leadingTone) {
    const diff = (chromaOf(r.root) - chromaOf(expected) + 12) % 12;
    acc = diff === 1 ? "♯" : diff === 11 ? "♭" : diff === 2 ? "𝄪" : diff === 10 ? "𝄫" : "";
  }
  const a = r.alias;
  const has = iv => r.tonePcs.includes((chromaOf(r.root) + iv) % 12);
  const lower = has(3) && !has(4);
  let num = NUM[deg];
  if (lower) num = num.toLowerCase();
  let suffix;
  if (a === "dim") suffix = "°";
  else if (a === "dim7") suffix = "°7";
  else if (a === "m7b5") suffix = "ø7";
  else if (a === "aug") suffix = "+";
  else if (a === "M" || a === "m") suffix = "";
  else suffix = r.type.replace(/^m(?!aj)/, "").replace(/^\((.*)\)$/, "$1");
  return acc + num + prettyAcc(suffix);
}

const TYPE_COST = {};
[
  [0,   "M m"],
  [1,   "7 maj7 m7 5"],
  [2,   "dim aug sus4 sus2 6 m6 m7b5 dim7 7sus4 Madd9 madd9 9 maj9 m9 7add6 m7add11"],
  [3,   "6add9 m69 11 m11 13 maj13 m13 7b9 7#9 7#11 7b5 7#5 maj7#5 m/ma7 7no5 9sus4 alt7 maj#4 9#11 maj9#11 13b9 13#11 7b13 b9sus 7#5#9 7#5b9 mM9 m9b5"],
].forEach(([cost, list]) => list.split(" ").forEach(t => (TYPE_COST[t] = cost)));
const DEFAULT_TYPE_COST = 4.5;
const SLASH_COST = 1.5;
// "Chord over an unrelated bass" (G/C): costs a bit more than an inversion,
// and is only tried when no exact reading is reasonably simple.
const HYBRID_EXTRA = 0.5;
const HYBRID_MAX_UPPER_COST = 2;
const HYBRID_TRY_ABOVE = 3;

// Nicer display for a few of tonal's type aliases
const TYPE_DISPLAY = {
  "M": "", "m/ma7": "m(maj7)", "maj#4": "maj7#11", "Madd9": "add9", "madd9": "m(add9)",
  "mM9": "m(maj9)", "alt7": "7alt", "m69": "m6/9", "6add9": "6/9", "b9sus": "7sus4b9",
  "5": "5", "4": "sus4(quartal)",
  // voicings that skip the 9th still get their usual names
  "7add6": "13", "7b6": "7b13", "m7add11": "m11", "M7add13": "maj13", "m11A": "m11#5",
};

function chromaOf(name) {
  return Tonal.Note.chroma(name);
}

function interpret(symbol, penalty, extraPc, hybrid) {
  const c = Chord.get(symbol);
  if (c.empty) return null;
  const alias = c.aliases[0];
  if (hybrid && (TYPE_COST[alias] ?? 99) > HYBRID_MAX_UPPER_COST) return null;
  // A power chord only makes sense with its root in the bass; an inverted
  // fifth (C below F) is just a fourth, so let the interval naming handle it.
  if (alias === "5" && c.bass) return null;
  const rootPc = chromaOf(c.tonic);
  const minorish = /minor|diminish|half/i.test(c.name) || c.quality === "Minor" || c.quality === "Diminished";
  const root = currentKey ? currentKey.spell[rootPc] : (minorish ? ROOT_MINOR : ROOT_MAJOR)[rootPc];
  // Spell every chord tone relative to the respelled root
  const tones = Chord.getChord(alias, root).notes;
  const spell = new Array(12).fill(null);
  tones.forEach(t => { spell[chromaOf(t)] = t; });
  let bass = "";
  if (c.bass) {
    const bpc = chromaOf(c.bass);
    bass = spell[bpc] || (currentKey ? currentKey.spell[bpc] : root.includes("b") ? ROOT_MAJOR[bpc] : SHARP[bpc]);
    if (/##|bb/.test(bass)) bass = currentKey ? currentKey.spell[bpc] : ROOT_MAJOR[bpc];
    if (currentKey && currentKey.inKey.has(bpc)) bass = currentKey.spell[bpc];
  }
  const type = alias in TYPE_DISPLAY ? TYPE_DISPLAY[alias] : alias.replace(/^M(?=\d)/, "maj");
  let cost = (TYPE_COST[alias] ?? DEFAULT_TYPE_COST) + (bass ? SLASH_COST : 0) + penalty;
  const tonePcs = tones.map(chromaOf);
  if (currentKey) {
    // Prefer readings that fit the key: in-key root, in-key tones, and the tonic itself
    if (!currentKey.inKey.has(rootPc)) cost += 1.0;
    cost += 0.4 * tonePcs.filter(pc => !currentKey.inKey.has(pc)).length;
    if (rootPc === currentKey.tonicPc) cost -= 0.7;
  }
  return {
    root, type, bass, cost, spell, alias, tonePcs,
    flats: root.includes("b"),
    extra: extraPc == null ? null : extraPc,
    text: root + type + (bass ? "/" + bass : ""),
    fullName: (alias === "5" ? `${root} power chord (perfect 5th)` : c.type ? `${root} ${c.type}` : root + type) + (bass ? ` over ${bass}` : ""),
  };
}

const INTERVAL_NAMES = ["Unison", "Minor 2nd", "Major 2nd", "Minor 3rd", "Major 3rd", "Perfect 4th",
  "Tritone", "Perfect 5th", "Minor 6th", "Major 6th", "Minor 7th", "Major 7th"];

function analyze(notes) {
  if (notes.length === 0) return null;
  // Unique pitch classes, ordered from the bass up
  const pcs = [];
  for (const n of notes) { const pc = n % 12; if (!pcs.includes(pc)) pcs.push(pc); }
  const names = pcs.map(pc => SHARP[pc]);

  if (pcs.length === 1) {
    return { kind: "note", pcs, text: pcName(pcs[0]), sub: "Single note", alts: [], spell: null };
  }

  const seen = new Map();
  const add = (symbols, penalty, extraPc, hybrid) => {
    symbols.forEach((sym, i) => {
      const r = interpret(sym, penalty + i * 0.01, extraPc, hybrid);
      if (!r) return;
      const prev = seen.get(r.text);
      if (!prev || prev.cost > r.cost) seen.set(r.text, r);
    });
  };

  add(Chord.detect(names), 0);
  add(Chord.detect(names, { assumePerfectFifth: true }), 0.5);  // allow an omitted 5th

  // Upper-structure slash chords (G/C, Bb/C, C/D): name the chord above the bass,
  // then put the bass under it, when the exact readings are all awkward.
  const bestExact = Math.min(Infinity, ...[...seen.values()].map(r => r.cost));
  if (pcs.length >= 4 && bestExact > HYBRID_TRY_ABOVE) {
    const upper = names.slice(1);
    const over = sym => sym + "/" + names[0];
    add(Chord.detect(upper).filter(x => !x.includes("/")).map(over), HYBRID_EXTRA, null, true);
    add(Chord.detect(upper, { assumePerfectFifth: true }).filter(x => !x.includes("/")).map(over), HYBRID_EXTRA + 0.5, null, true);
  }

  // Nothing exact? Try ignoring one non-bass note (passing / added tone).
  if (seen.size === 0 && pcs.length >= 4) {
    for (let i = 1; i < pcs.length; i++) {
      const sub = names.filter((_, j) => j !== i);
      add(Chord.detect(sub), 3, pcs[i]);
      add(Chord.detect(sub, { assumePerfectFifth: true }), 3.5, pcs[i]);
    }
  }

  // Reject far-fetched readings (mostly clusters forced into a name)
  const MAX_COST = 6;
  const ranked = [...seen.values()].filter(r => r.cost <= MAX_COST).sort((a, b) => a.cost - b.cost);

  if (ranked.length === 0) {
    if (pcs.length === 2) {
      const iv = (pcs[1] - pcs[0] + 12) % 12;
      return { kind: "interval", pcs, text: pcName(pcs[0]) + "–" + pcName(pcs[1]),
               sub: INTERVAL_NAMES[iv], alts: [], spell: null };
    }
    return { kind: "unknown", pcs, text: "?", sub: "No chord match", alts: [], spell: null };
  }

  const best = ranked[0];
  let sub = best.fullName ? capitalize(best.fullName) : "";
  if (best.extra != null) {
    const ex = best.spell[best.extra] || pcName(best.extra, best.flats);
    sub = (sub ? sub + " " : "") + "with added " + ex;
  }
  return { kind: "chord", pcs, best, text: best.text, sub,
           roman: currentKey ? romanFor(best, currentKey) : "",
           alts: ranked.slice(1).filter(r => r.cost <= best.cost + 2.5).slice(0, 3).map(r => r.text + (r.extra != null ? "*" : "")), spell: best.spell, flats: best.flats };
}

function pcName(pc, flats) {
  if (currentKey) return currentKey.spell[pc];
  return (flats ? ROOT_MAJOR : flats === false ? SHARP : ROOT_MAJOR)[pc];
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------------------------------------------------------------
   Spelling MIDI notes for the staff
   --------------------------------------------------------------- */

function spellNote(midi, result) {
  const pc = midi % 12;
  let name = result && result.spell && result.spell[pc];
  if (!name) {
    if (currentKey) name = currentKey.spell[pc];
    else name = ((result && result.flats) ? ROOT_MAJOR : SHARP)[pc];
  }
  const letter = name[0];
  const accStr = name.slice(1);
  const alter = alterOf(accStr);
  const octave = (midi - alter - LETTER_PC[letter]) / 12 - 1;
  return { letter, acc: accStr, alter, octave, step: LETTERS.indexOf(letter) + 7 * octave, midi };
}

/* ---------------------------------------------------------------
   Grand staff rendering (VexFlow)
   --------------------------------------------------------------- */
const STAFF_W = 300;
const LINE_SP = 10;

function drawStaff(notes, result) {
  const el = document.getElementById("staff");
  el.innerHTML = "";
  const sustainedNow = new Set([...sustained].filter(n => !held.has(n)));
  const spelled = notes.map(n => ({ ...spellNote(n, result), sus: sustainedNow.has(n) }));
  const treble = spelled.filter(n => n.midi >= 60);
  const bass = spelled.filter(n => n.midi < 60);

  // Fixed layout: always reserve ledger-line room for the full piano range
  // (C8 = step 56 above the treble's top line F5 = 38; A0 = step 5 below the bass's bottom line G2 = 18),
  // so the staff never moves when a very high or low note appears.
  const top = 34 + (56 - 38) * (LINE_SP / 2);
  const bottom = 34 + (18 - 5) * (LINE_SP / 2);
  const gap = 72;
  const trebleY = top, bassY = trebleY + 4 * LINE_SP + gap;
  const height = bassY + 4 * LINE_SP + bottom;
  const width = STAFF_W + 40;

  const renderer = new VF.Renderer(el, VF.Renderer.Backends.SVG);
  renderer.resize(width, height);
  const ctx = renderer.getContext();
  const svg = el.querySelector("svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.style.width = "min(100%, 620px)";
  svg.style.height = "auto";

  const opts = { space_above_staff_ln: 0, space_below_staff_ln: 0 };
  const tStave = new VF.Stave(26, trebleY, STAFF_W, opts).addClef("treble");
  const bStave = new VF.Stave(26, bassY, STAFF_W, opts).addClef("bass");
  if (currentKey) { tStave.addKeySignature(currentKey.vfKey); bStave.addKeySignature(currentKey.vfKey); }
  const startX = Math.max(tStave.getNoteStartX(), bStave.getNoteStartX());
  tStave.setNoteStartX(startX);
  bStave.setNoteStartX(startX);
  tStave.setContext(ctx).draw();
  bStave.setContext(ctx).draw();
  new VF.StaveConnector(tStave, bStave).setType("brace").setContext(ctx).draw();
  new VF.StaveConnector(tStave, bStave).setType("singleLeft").setContext(ctx).draw();
  new VF.StaveConnector(tStave, bStave).setType("singleRight").setContext(ctx).draw();

  // Both chords share one tick context pinned at a fixed x, so noteheads never
  // slide sideways (accidentals extend to the left of that point instead).
  const NOTE_X = 120;
  const tc = new VF.TickContext();
  const built = [];
  const makeChord = (list, clef, stave) => {
    if (!list.length) return;
    const note = new VF.StaveNote({
      clef, duration: "w",
      keys: list.map(n => `${n.letter.toLowerCase()}${n.acc}/${n.octave}`),
    });
    list.forEach((n, i) => {
      // Show an accidental only where the note differs from the key signature
      const sig = currentKey ? (currentKey.sigAlter[n.letter] || 0) : 0;
      if (n.alter !== sig) note.addModifier(new VF.Accidental(n.alter === 0 ? "n" : n.acc), i);
      if (n.sus) note.setKeyStyle(i, { fillStyle: "#9a968c", strokeStyle: "#9a968c" });
    });
    note.setStave(stave).setContext(ctx);
    note.addToModifierContext(new VF.ModifierContext());
    tc.addTickable(note);
    built.push(note);
  };
  makeChord(treble, "treble", tStave);
  makeChord(bass, "bass", bStave);
  if (built.length) {
    tc.preFormat().setX(NOTE_X);
    built.forEach(n => n.draw());
  }
}

/* ---------------------------------------------------------------
   Chord name rendering
   --------------------------------------------------------------- */
function prettyAcc(s) {
  return s.replace(/##/g, "𝄪").replace(/bb/g, "𝄫").replace(/#/g, "♯").replace(/b/g, "♭");
}

function renderName(result) {
  const nameEl = document.getElementById("chordName");
  const subEl = document.getElementById("chordSub");
  const altsEl = document.getElementById("alts");
  const notesEl = document.getElementById("notes");

  if (!result) {
    // Keep the last chord visible, faded
    nameEl.classList.toggle("stale", !!lastResult);
    if (!lastResult) { nameEl.innerHTML = ""; subEl.textContent = "Play something"; document.getElementById("roman").textContent = ""; }
    notesEl.innerHTML = "";
    return;
  }
  lastResult = result;
  nameEl.classList.remove("stale");

  if (result.kind === "chord") {
    const b = result.best;
    const root = esc(b.root[0]) + (b.root.length > 1 ? `<span class="acc">${prettyAcc(b.root.slice(1))}</span>` : "");
    // Quality letters stay full size; numeric extensions get raised
    const m = b.type.match(/^(m(?!aj)|dim|aug|sus\d?|maj|M)?(.*)$/);
    const qual = m[1] || "", ext = m[2] || "";
    let html = root + esc(qual);
    if (ext) html += `<span class="ext">${esc(prettyAcc(ext))}</span>`;
    if (b.bass) html += `<span class="bass">/${esc(b.bass[0])}${b.bass.length > 1 ? `<span class="acc">${prettyAcc(b.bass.slice(1))}</span>` : ""}</span>`;
    nameEl.innerHTML = html;
  } else {
    nameEl.textContent = prettyAcc(result.text);
  }
  document.getElementById("roman").textContent = result.roman || "";
  subEl.textContent = (result.sub || "").replace(/([A-G])(#{1,2}|b{1,2})/g, (_, l, acc) => l + prettyAcc(acc));
  altsEl.innerHTML = result.alts.map(a => `<span>${esc(prettyAcc(a))}</span>`).join("");
}

function renderNoteList(notes, result) {
  const notesEl = document.getElementById("notes");
  if (!notes.length) { notesEl.innerHTML = ""; return; }
  notesEl.innerHTML = notes.map(n => {
    const s = spellNote(n, result);
    const label = esc(prettyAcc(s.letter + s.acc) + s.octave);
    return held.has(n) ? `<b>${label}</b>` : `<span class="sus">${label}</span>`;
  }).join("  ");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------------------------------------------------------------
   Update loop: staff redraws every frame something changes; the
   chord name waits for ~40ms of stillness so a rolled chord
   doesn't flicker through partial names.
   --------------------------------------------------------------- */
let frameQueued = false, nameTimer = null, currentResult = null;

function changed() {
  if (!frameQueued) {
    frameQueued = true;
    requestAnimationFrame(() => {
      frameQueued = false;
      const notes = soundingNotes();
      currentResult = analyze(notes);
      drawStaff(notes, currentResult);
      renderNoteList(notes, currentResult);
    });
  }
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => renderName(analyze(soundingNotes())), 40);
}

/* ---------------------------------------------------------------
   Computer keyboard input (for testing without a controller)
   --------------------------------------------------------------- */
const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ";": 16 };
let kbdOctave = 4;
const kbdDown = new Map();
function showOct() { document.getElementById("kbdOct").textContent = "Keyboard octave: C" + kbdOctave; }

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (e.key === "Escape") { allOff(); kbdDown.clear(); return; }
  if (e.repeat) { if (k in KEYMAP || k === " ") e.preventDefault(); return; }
  if (k === " ") { e.preventDefault(); setPedal("kbd", true); return; }
  if (k === "z") { kbdOctave = Math.max(0, kbdOctave - 1); showOct(); return; }
  if (k === "x") { kbdOctave = Math.min(8, kbdOctave + 1); showOct(); return; }
  if (k in KEYMAP) {
    const note = 12 * (kbdOctave + 1) + KEYMAP[k];
    kbdDown.set(k, note);
    noteOn(note, "kbd");
  }
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === " ") { setPedal("kbd", false); return; }
  if (kbdDown.has(k)) { noteOff(kbdDown.get(k), "kbd"); kbdDown.delete(k); }
});
window.addEventListener("blur", () => { for (const n of kbdDown.values()) noteOff(n, "kbd"); kbdDown.clear(); setPedal("kbd", false); });

document.getElementById("retry").onclick = () => { document.getElementById("retry").hidden = true; setStatus("", "Requesting MIDI access…"); initMidi(); };
document.getElementById("panic").onclick = () => { allOff(); kbdDown.clear(); };
document.getElementById("optPedal").onchange = changed;

(function initKeySelect() {
  const sel = document.getElementById("keySel");
  const opt = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; return o; };
  sel.append(opt("", "None"));
  const gMaj = document.createElement("optgroup"); gMaj.label = "Major";
  KEY_MAJORS.forEach(t => gMaj.append(opt(t + ":major", prettyAcc(t) + " major")));
  const gMin = document.createElement("optgroup"); gMin.label = "Minor";
  KEY_MINORS.forEach(t => gMin.append(opt(t + ":minor", prettyAcc(t) + " minor")));
  sel.append(gMaj, gMin);
  let saved = "";
  try { saved = localStorage.getItem("chordDisplay.key") || ""; } catch (e) {}
  sel.value = saved;
  if (sel.value !== saved) sel.value = "";
  currentKey = buildKey(sel.value);
  sel.onchange = () => {
    currentKey = buildKey(sel.value);
    try { localStorage.setItem("chordDisplay.key", sel.value); } catch (e) {}
    lastResult = null;
    sel.blur();   // so computer-key note input keeps working
    changed();
  };
})();

showOct();
changed();
initMidi();
// Exposed for testing in the console: __chord.analyze([60,64,67])
window.__chord = { setKey: v => { const s = document.getElementById("keySel"); s.value = v; s.onchange(); }, analyze, noteOn, noteOff, setPedal, allOff };
</script>
